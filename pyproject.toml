[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "youtwo"
version = "0.1.0"
authors = [{name = "Tan"}]
description = "Knowledge-graph memory for AI agents: a Convex backend and an MCP server"
readme = "README.md"
requires-python = ">=3.10"
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
]

dependencies = [
    "httpx",
    "mcp>=1.10,<2",
    "python-dotenv",
]

[project.scripts]
youtwo-mcp = "youtwo.mcp_server:main"

[dependency-groups]
dev = ["pytest>=8"]

# Ruff config

[tool.ruff]
exclude = [
    "**/__pycache__",
    "**/.git", 
    "**/.venv",
    "**/node_modules",
    "**/dist",
    "**/backend",
]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "C", "N", "Q", "S", "T", "B", "PL"]
ignore = ["E501"]
isort = { known-first-party = ["youtwo"] }
per-file-ignores = { "tests/*" = ["S101", "S105", "S106", "S107"] }

[tool.ruff.format]
docstring-code-format = true
docstring-code-line-length = 80
